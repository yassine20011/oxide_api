[package]
name = "rustcore"
version = "0.1.0"
edition = "2021"

[lib]
name = "_rustcore"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
matchit = "0.9"

[[test]]
name = "test_rust_core"
path = "../tests/test_rust_core.rs"